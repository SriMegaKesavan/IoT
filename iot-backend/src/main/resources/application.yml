server:
  port: 8080

logging:
  level:
    "[org.springframework.security]": WARN
    "[com.srimega.iot.config]": WARN
    "[com.srimega.iot.ai]": DEBUG
    "[org.springframework.web.client]": DEBUG

ollama:
  base-url: http://localhost:11434
  model: phi3

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/iot_db
    username: postgres
    password: postgres

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 50


management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: always

mqtt:
  broker: tcp://localhost:1883
  client-id: iot-backend-client

