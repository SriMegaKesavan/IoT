server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/iot_db
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 50


management:
  endpoints:
    web:
      exposure:
        include: health
    endpoint:
      health:
        show-details: always

mqtt:
  broker: tcp://localhost:1883
  client-id: iot-backend-client

